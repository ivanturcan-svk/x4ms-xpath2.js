# Moves an npm dist-tag of this package to an already-published version.
#
# Why a workflow and not one local command: moving a dist-tag is a write against
# the public registry, and this project keeps no long-lived npm credentials —
# the bootstrap token was revoked once trusted publishing was configured (see
# publish.yml). Authentication therefore goes the same way a publish does:
# GitHub OIDC → short-lived registry token. Nothing to store, nothing to leak.
#
# Reusable on purpose. The immediate need is moving "latest" onto the
# strict-mode fix, but the same run promotes an "rc" to "latest" at release
# time — pass the tag and the version as inputs, do not edit this file.
#
# The target version must already be published; a dist-tag pointing at a version
# that does not exist breaks the package page and `npm install`. The workflow
# refuses to run in that case rather than trusting the operator's typing.

name: Move dist-tag

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'Dist-tag to move (e.g. latest)'
        required: true
        default: 'latest'
      version:
        description: 'Already-published version the tag should point at (e.g. 1.0.0-beta.2)'
        required: true

permissions: {}

jobs:
  move-dist-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — same grant trusted publishing uses
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Resolve package name
        run: echo "PKG=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - name: Refuse to point the tag at a version that is not published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "Package: $PKG"
          echo "Requested version: $VERSION"
          if ! npm view "$PKG@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$PKG@$VERSION is not published — refusing to move a dist-tag onto it."
            exit 1
          fi
          echo "Dist-tags before:"
          npm dist-tag ls "$PKG" --registry https://registry.npmjs.org

      # First try npm's own OIDC handling. If the CLI wires trusted publishing
      # into `dist-tag` the way it does into `publish`, nothing else is needed.
      - name: Move the dist-tag (npm-native OIDC)
        id: native
        continue-on-error: true
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ inputs.version }}
        run: npm dist-tag add "$PKG@$VERSION" "$DIST_TAG"

      # Fallback: perform the OIDC exchange explicitly. Still trusted
      # publishing — the same GitHub identity, the same registry endpoint, a
      # token that lives for minutes and is never stored anywhere.
      - name: Exchange the OIDC identity for a short-lived registry token
        if: steps.native.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "npm did not authenticate dist-tag on its own; doing the OIDC exchange explicitly."
          id_token="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')"
          if [ -z "$id_token" ] || [ "$id_token" = "null" ]; then
            echo "::error::GitHub did not issue an OIDC identity token."
            exit 1
          fi
          encoded_pkg="$(printf '%s' "$PKG" | jq -sRr @uri)"
          response="$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            -H 'Content-Type: application/json' \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$encoded_pkg")"
          status="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"
          if [ "$status" != "200" ]; then
            echo "::error::Registry refused the OIDC exchange (HTTP $status): $body"
            exit 1
          fi
          token="$(printf '%s' "$body" | jq -r '.token')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Registry returned no token: $body"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "NPM_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Move the dist-tag (explicit OIDC token)
        if: steps.native.outcome == 'failure'
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ env.NPM_OIDC_TOKEN }}
        run: npm dist-tag add "$PKG@$VERSION" "$DIST_TAG"

      # Reads back from the registry rather than trusting the command's exit
      # code — this is what a consumer running `npm install` actually gets.
      - name: Verify against the public registry
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "Dist-tags after:"
          npm dist-tag ls "$PKG" --registry https://registry.npmjs.org
          actual="$(npm view "$PKG" "dist-tags.$DIST_TAG" --registry https://registry.npmjs.org)"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::$DIST_TAG is $actual, expected $VERSION."
            exit 1
          fi
          echo "$DIST_TAG now points at $VERSION."
